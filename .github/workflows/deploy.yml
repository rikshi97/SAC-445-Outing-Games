name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Firebase config
        env:
          FIREBASE_CONST: ${{ secrets.FIREBASE_CONST }}
        run: |
          # Replace the placeholder const block with the real secret
          python3 - <<'EOF'
import os, re

with open("index.html", "r") as f:
    content = f.read()

placeholder = r'const firebaseConfig = \{[^}]*\};'
replacement = os.environ["FIREBASE_CONST"]
content = re.sub(placeholder, replacement, content, flags=re.DOTALL)

with open("index.html", "w") as f:
    f.write(content)

print("Firebase config injected successfully.")
EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          force_orphan: true
