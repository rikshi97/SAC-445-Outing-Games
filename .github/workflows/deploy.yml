name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Firebase config
        env:
          FIREBASE_CONST: ${{ secrets.FIREBASE_CONST }}
        run: |
          node -e "
            const fs = require('fs');
            let html = fs.readFileSync('index.html', 'utf8');
            const replacement = process.env.FIREBASE_CONST.trim();
            html = html.replace(/const firebaseConfig\s*=\s*\{[\s\S]*?\};/, replacement);
            fs.writeFileSync('index.html', html);
            console.log('Done.');
          "

      - name: Verify injection
        run: |
          if grep -q "PASTE_YOUR_API_KEY" index.html; then
            echo "ERROR: Placeholder still present - injection failed"
            exit 1
          else
            echo "Injection verified OK"
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          force_orphan: true
